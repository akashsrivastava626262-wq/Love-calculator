name: Deploy AAKSHI to GitHub Pages

on:
  push:
    branches: [cursor/aakshi-luxury-ecommerce-6857, main]
    paths:
      - "apps/web/**"
      - ".github/workflows/deploy-aakshi-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: aakshi-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: npm run build:web --workspace=apps/web
        env:
          GITHUB_PAGES: "true"
          NEXT_PUBLIC_SITE_URL: https://akashsrivastava626262-wq.github.io/Love-calculator

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
