name: Deploy AAKSHI Staging to GitHub Pages

on:
  push:
    branches: [cursor/aakshi-ecommerce-2b88, main]
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-aakshi-staging.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aakshi-staging-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build static export
        working-directory: frontend
        env:
          NEXT_STATIC_EXPORT: 'true'
          NEXT_PUBLIC_BASE_PATH: /Love-calculator
          NEXT_PUBLIC_API_URL: https://aakshi-api-staging.onrender.com/api
          NEXT_PUBLIC_SITE_URL: https://akashsrivastava626262-wq.github.io/Love-calculator
        run: npm run build

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: frontend/out
          commit_message: 'deploy: AAKSHI staging frontend'
